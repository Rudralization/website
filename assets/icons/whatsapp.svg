<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass WhatsApp Icon -->
    <linearGradient id="waGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="waSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#86efac" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="waClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="waShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#052e16" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g clip-path="url(#waClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#waGlass)"/>

    <!-- 3D Liquid Glass Chat Bubble + Phone -->
    <g filter="url(#waShadow)">
      <path d="M128 50 C83.8 50 48 84.5 48 127 C48 141.6 52.3 155.3 59.7 166.9 L49 205 L88.6 194.6 C100.3 200.6 113.7 204 128 204 C172.2 204 208 169.5 208 127 C208 84.5 172.2 50 128 50 Z"
        fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="13" stroke-linejoin="round"/>
      <path d="M101 93 C98 93 93 96 93 105 C93 118 104 136 117 147 C131 159 149 164 157 164 C165 164 170 158 171 152 C171.5 148.5 160 143 156 141.5 C153 140.5 150.5 141.5 148 145 C146 147.8 143.5 149.5 140.5 148 C132 144 121 135 116 126 C114.5 123 116 120.5 118.5 118 C120.5 116 122 113.5 120.5 110 C119 106.5 113 95 109.5 93.5 C107 92.8 103.5 93 101 93 Z"
        fill="#ffffff"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#waSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#waRim)" stroke-width="3"/>
</svg>
