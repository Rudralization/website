<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass Mail Icon -->
    <linearGradient id="mlGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="mlEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mlSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mlRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="mlClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="mlShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1e3a8a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#mlClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#mlGlass)"/>

    <!-- 3D Liquid Glass Envelope -->
    <g filter="url(#mlShadow)">
      <rect x="44" y="68" width="168" height="120" rx="22" fill="url(#mlEnv)"/>
      <path d="M48 76 L128 138 L208 76" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#mlSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#mlRim)" stroke-width="3"/>
</svg>
