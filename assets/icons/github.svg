<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass GitHub Icon -->
    <linearGradient id="ghGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="ghSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ghRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <clipPath id="ghClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="ghShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <g clip-path="url(#ghClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#ghGlass)"/>
    <!-- Ambient Purple/Indigo Glass Refraction Glow -->
    <circle cx="128" cy="195" r="78" fill="#8b5cf6" fill-opacity="0.22"/>

    <!-- 3D Liquid Glass GitHub Octocat Silhouette -->
    <path filter="url(#ghShadow)" fill="#ffffff" fill-opacity="0.96" fill-rule="evenodd" clip-rule="evenodd"
      d="M128 46C81.6 46 44 83.6 44 130C44 167.2 68.1 198.7 101.5 209.8C105.7 210.6 107.2 208 107.2 205.8C107.2 203.8 107.1 197.3 107.1 190.4C86 194.3 80.5 185.3 78.8 180.6C77.9 178.2 73.8 170.8 70.2 168.8C67.3 167.2 63.1 163.3 70.1 163.2C76.7 163.1 81.4 169.3 83 171.8C90.6 184.5 102.7 180.9 107.5 178.7C108.3 173.2 110.5 169.5 112.9 167.4C94.2 165.3 74.6 158.1 74.6 125.9C74.6 116.8 77.9 109.2 83.2 103.4C82.4 101.3 79.4 92.6 84 81C84 81 91.1 78.8 107.1 89.6C113.8 87.7 120.9 86.8 128 86.8C135.1 86.8 142.2 87.7 148.9 89.6C164.9 78.7 172 81 172 81C176.6 92.6 173.6 101.3 172.8 103.4C178.1 109.2 181.4 116.7 181.4 125.9C181.4 158.2 161.7 165.3 142.9 167.4C146 170 148.6 175 148.6 182.8C148.6 194 148.5 203 148.5 205.8C148.5 208 150 210.7 154.2 209.8C187.9 198.7 212 167.1 212 130C212 83.6 174.4 46 128 46Z"/>

