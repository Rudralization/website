    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#ghSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#ghRim)" stroke-width="3"/>
