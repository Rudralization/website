<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass Settings Icon -->
    <linearGradient id="stGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="stGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="stSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="stClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="stShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g clip-path="url(#stClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#stGlass)"/>
    <!-- Inner Recessed Dark Glass Well -->
    <circle cx="128" cy="128" r="84" fill="#1e293b" fill-opacity="0.55"/>

    <!-- 3D Liquid Glass Gear -->
    <g filter="url(#stShadow)" stroke="url(#stGear)" stroke-linecap="round">
      <line x1="128" y1="44" x2="128" y2="212" stroke-width="22"/>
      <line x1="44" y1="128" x2="212" y2="128" stroke-width="22"/>
      <line x1="68.6" y1="68.6" x2="187.4" y2="187.4" stroke-width="22"/>
      <line x1="187.4" y1="68.6" x2="68.6" y2="187.4" stroke-width="22"/>
      <circle cx="128" cy="128" r="56" fill="none" stroke-width="22"/>
      <circle cx="128" cy="128" r="24" fill="#0f172a" stroke-width="8"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#stSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#stRim)" stroke-width="3"/>
</svg>
