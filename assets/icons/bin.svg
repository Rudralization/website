<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass Bin Icon -->
    <linearGradient id="bnGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#cbd5e1" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bnCan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="bnSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bnRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="bnClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="bnShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#bnClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#bnGlass)"/>

    <!-- 3D Frosted Glass Mesh Trash Can -->
    <g filter="url(#bnShadow)">
      <path d="M72 78 H184 L172 200 C171 210 163 216 153 216 H103 C93 216 85 210 84 200 Z" fill="url(#bnCan)" stroke="#ffffff" stroke-width="3"/>
      <ellipse cx="128" cy="78" rx="58" ry="12" fill="#475569"/>
      <ellipse cx="128" cy="78" rx="56" ry="10" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>
      <!-- Vertical Glass Flutes -->
      <line x1="104" y1="102" x2="108" y2="196" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>
      <line x1="128" y1="104" x2="128" y2="196" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>
      <line x1="152" y1="102" x2="148" y2="196" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#bnSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#bnRim)" stroke-width="3"/>
</svg>
