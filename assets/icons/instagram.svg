<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass Instagram Icon -->
    <radialGradient id="igGlass" cx="28%" cy="105%" r="125%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#fb7185" stop-opacity="0.88"/>
      <stop offset="58%" stop-color="#d946ef" stop-opacity="0.86"/>
      <stop offset="92%" stop-color="#4f46e5" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="igSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="igRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="igClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="igShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a044e" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g clip-path="url(#igClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#igGlass)"/>

    <!-- Inner Frosted Glass Camera Plate -->
    <rect x="52" y="52" width="152" height="152" rx="44" fill="#ffffff" fill-opacity="0.14"/>

    <!-- 3D Glass Camera Glyph -->
    <g filter="url(#igShadow)">
      <rect x="54" y="54" width="148" height="148" rx="42" fill="none" stroke="#ffffff" stroke-width="14"/>
      <circle cx="128" cy="128" r="36" fill="none" stroke="#ffffff" stroke-width="14"/>
      <circle cx="173" cy="83" r="9.5" fill="#ffffff"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#igSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#igRim)" stroke-width="3"/>
</svg>
