<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Liquid Glass YouTube Icon -->
    <linearGradient id="ytGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="ytSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ytRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fca5a5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="ytClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="ytShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#450a0a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g clip-path="url(#ytClip)">
    <rect x="14" y="14" width="228" height="228" fill="url(#ytGlass)"/>

    <!-- Frosted Glass Screen Pill + Play Triangle -->
    <g filter="url(#ytShadow)">
      <rect x="44" y="68" width="168" height="120" rx="34" fill="#ffffff" fill-opacity="0.95"/>
      <path d="M110 100 L158 128 L110 156 Z" fill="#dc2626"/>
    </g>

    <!-- Top-Left Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V102 C180 128 85 108 14 150 Z" fill="url(#ytSheen)"/>
  </g>

  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#ytRim)" stroke-width="3"/>
</svg>
