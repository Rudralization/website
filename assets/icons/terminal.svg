<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- macOS 27 Dark Spatial Liquid Glass Terminal -->
    <linearGradient id="tmGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tmSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tmRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="tmPrompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <clipPath id="tmClip">
      <rect x="14" y="14" width="228" height="228" rx="54"/>
    </clipPath>
    <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g clip-path="url(#tmClip)">
    <!-- Dark Smoked Glass Squircle -->
    <rect x="14" y="14" width="228" height="228" fill="url(#tmGlass)"/>
    <!-- Frosted Top Window Bar -->
    <rect x="14" y="14" width="228" height="44" fill="#ffffff" fill-opacity="0.08"/>
    <line x1="14" y1="58" x2="242" y2="58" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

    <!-- Glass Traffic Lights -->
    <circle cx="46" cy="36" r="7" fill="#ff5f57"/>
    <circle cx="68" cy="36" r="7" fill="#febc2e"/>
    <circle cx="90" cy="36" r="7" fill="#28c840"/>

    <!-- 3D Glowing Prompt `>_` -->
    <g filter="url(#tmGlow)">
      <path d="M58 100 L102 134 L58 168" fill="none" stroke="url(#tmPrompt)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="122" y1="168" x2="178" y2="168" stroke="#4ade80" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- Diagonal Liquid Glass Specular Sheen -->
    <path d="M14 14 H242 V100 C175 128 85 106 14 152 Z" fill="url(#tmSheen)"/>
    <ellipse cx="128" cy="236" rx="85" ry="16" fill="#4ade80" fill-opacity="0.18"/>
  </g>

  <!-- Specular Prism Rim -->
  <rect x="15.5" y="15.5" width="225" height="225" rx="52.5" fill="none" stroke="url(#tmRim)" stroke-width="3"/>
  <rect x="18.5" y="18.5" width="219" height="219" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
</svg>
